<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a1420; --bg2:#51233a;
  --blush:#f0cfd0; --blush-deep:#e3b4b9; --flap:#f7dede;
  --seal:#9c1f3d; --seal-hi:#c23556;
  --paper:#fffafa; --ink:#4a2a35; --muted:#8a6571; --rose:#b4506b; --line:#ecd3d6;
  --serif:"Italiana",Georgia,"Times New Roman",serif;
  --script:"Pinyon Script","Snell Roundhand",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 20%,var(--bg2),var(--bg1) 70%);
  background-color:var(--bg1);
  font-family:var(--serif);color:var(--ink);
}
.stage{height:100%;display:grid;place-items:center;padding:16px;position:relative}
.stage>*{grid-area:1/1}

/* drifting hearts */
.bg-heart,.pop{position:fixed;pointer-events:none;color:var(--rose)}
.bg-heart{bottom:-30px;opacity:0;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:.22}100%{transform:translateY(-110vh) rotate(12deg);opacity:0}}

/* envelope */
.envelope-wrap{
  display:flex;flex-direction:column;align-items:center;gap:36px;
  transition:transform .9s ease,opacity .7s ease;
}
.envelope{
  position:relative;width:min(84vw,340px);aspect-ratio:340/230;
  perspective:900px;
  filter:drop-shadow(0 24px 30px rgba(0,0,0,.4));
}
.envelope>*{position:absolute}
.back{inset:0;background:var(--blush-deep);border-radius:6px}
.strip{
  left:6%;right:6%;top:6%;height:88%;background:var(--paper);border-radius:3px;z-index:2;
  transition:transform .8s cubic-bezier(.3,.7,.2,1) .55s;
  padding:14px;
}
.strip i{display:block;height:2px;background:var(--line);margin-bottom:10px;border-radius:2px}
.pocket{
  inset:0;z-index:3;border-radius:6px;
  background:linear-gradient(115deg,#f4d6d7 0%,var(--blush) 50%,#ecc5c9 100%);
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);
}
.to{
  position:absolute;left:0;right:0;bottom:11%;z-index:4;text-align:center;
  font-family:var(--script);font-size:clamp(26px,8vw,34px);color:var(--seal);pointer-events:none;
}
.flap{
  left:0;right:0;top:0;height:55%;z-index:5;background:var(--flap);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform .7s cubic-bezier(.5,0,.2,1),z-index 0s .35s;
}
.seal{
  left:50%;top:55%;z-index:6;width:58px;height:58px;margin:-29px 0 0 -29px;border:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--seal-hi),var(--seal) 65%);
  color:#f9dfe4;font-size:24px;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.08);
  animation:beat 2.2s ease-in-out infinite;
  transition:transform .4s ease,opacity .4s ease;
}
.seal:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.hint{font-style:italic;font-size:20px;color:#e9c3cc;letter-spacing:.02em;transition:opacity .4s}

.is-open .seal{animation:none;transform:scale(.4);opacity:0;pointer-events:none}
.is-open .flap{transform:rotateX(180deg);z-index:1}
.is-open .strip{transform:translateY(-34%)}
.is-open .hint{opacity:0}
.reading .envelope-wrap{transform:translateY(40vh) scale(.8);opacity:0;pointer-events:none}

/* letter */
.card{
  width:min(92vw,470px);max-height:calc(100% - 8px);overflow:auto;
  background:var(--paper);border-radius:8px;padding:38px clamp(24px,7vw,46px) 34px;
  box-shadow:0 30px 60px rgba(0,0,0,.45);
  opacity:0;visibility:hidden;transform:translateY(60px) scale(.94);
  transition:opacity .8s ease .15s,transform .9s cubic-bezier(.2,.8,.2,1) .15s,visibility 0s .15s;
  text-align:center;border:1px solid #f3dfe1;
}
.reading .card{opacity:1;visibility:visible;transform:none}
.dear{font-family:var(--script);font-size:34px;color:var(--rose);margin:0 0 6px}
h1{font-weight:500;font-style:italic;font-size:clamp(30px,8.4vw,40px);line-height:1.1;margin:0 0 18px;color:var(--ink)}
.lead{font-size:19px;line-height:1.55;color:var(--muted);margin:0 auto 22px;max-width:34ch}
.divider{display:flex;align-items:center;gap:12px;color:var(--rose);margin:4px 0 20px;font-size:14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
dl{margin:0 0 24px;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;text-align:left;font-size:20px}
dt{font-style:italic;color:var(--rose)}
dd{margin:0}
h2{font-family:var(--script);font-weight:400;font-size:32px;color:var(--rose);margin:0 0 12px}
.plan{list-style:none;margin:0 0 26px;padding:0 0 0 22px;text-align:left;border-left:1px solid var(--line);margin-left:6px}
.plan li{position:relative;padding:0 0 16px;font-size:19px;line-height:1.35}
.plan li::before{content:"";position:absolute;left:-28px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--rose)}
.plan b{font-weight:600;display:block}
.plan span{color:var(--muted);font-style:italic}
.sign{font-family:var(--script);font-size:32px;color:var(--ink);margin:0 0 4px}
.sign small{display:block;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{
  font:inherit;font-size:19px;padding:11px 24px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rose);color:var(--rose);background:transparent;transition:background .25s,color .25s;
}
.btn.yes{background:var(--seal);border-color:var(--seal);color:#fff}
.btn:hover{background:var(--rose);color:#fff;border-color:var(--rose)}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.reply{min-height:1.4em;margin:16px 0 0;font-style:italic;font-size:20px;color:var(--seal)}
.pop{font-size:22px;animation:pop 1.8s ease-out forwards;z-index:20}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<main class="stage" id="stage">

  <div class="envelope-wrap">
    <div class="envelope" id="envelope">
      <div class="back"></div>
      <div class="strip"><i></i><i></i><i></i></div>
      <div class="pocket"></div>
      <div class="to" id="toLabel"></div>
      <div class="flap"></div>
      <button class="seal" id="seal" aria-label="Open the invitation">&#10084;</button>
    </div>
    <div class="hint">Something for you. Tap the seal.</div>
  </div>

  <article class="card" id="card" aria-live="polite">
    <p class="dear" id="dear"></p>
    <h1>You're invited on a date with me</h1>
    <p class="lead" id="lead"></p>
    <div class="divider" aria-hidden="true">&#10084;</div>
    <dl id="details"></dl>
    <h2>The plan</h2>
    <ol class="plan" id="plan"></ol>
    <p class="sign" id="sign"></p>
  </article>

</main>

<script>
/* ===== EDIT YOUR DETAILS HERE ===== */
const INVITE = {
  to: "Esther Gan",                     // her/his name (or add ?to=Name to the link)
  from: "Qi Jun",                   // your name (or ?from=Name)
  lead: "I've been wanting to do this for a while. No pressure, just a lovely evening, and I'd really like you there.",
  details: [
    ["Date",  "Saturday, 17 October"],
    ["Time",  "6:30 PM"],
    ["Venue", "Your venue name, address"],
    ["Dress", "Whatever makes you feel good"]
  ],
  plan: [
    ["6:30 PM", "Dinner", "A quiet table, good food, long conversation"],
    ["8:30 PM", "A walk", "Along the waterfront, at golden-hour's end"],
    ["9:30 PM", "Dessert", "Something sweet to end the night"]
  ]
};
/* =================================== */

const q = new URLSearchParams(location.search);
const to = q.get("to") || INVITE.to, from = q.get("from") || INVITE.from;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("toLabel").textContent = "For " + to;
$("dear").textContent = "Dear " + to + ",";
$("lead").textContent = INVITE.lead;
$("details").innerHTML = INVITE.details.map(d => `<dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd>`).join("");
$("plan").innerHTML = INVITE.plan.map(p => `<li><b>${esc(p[1])}</b>${esc(p[0])} <span>· ${esc(p[2])}</span></li>`).join("");
$("sign").innerHTML = `Yours,<br>${esc(from)}`;

/* background hearts */
for (let i = 0; i < 12; i++) {
  const h = document.createElement("span");
  h.className = "bg-heart"; h.textContent = "\u2665";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 14 + Math.random() * 22 + "px";
  h.style.animationDuration = 12 + Math.random() * 14 + "s";
  h.style.animationDelay = -Math.random() * 20 + "s";
  document.body.appendChild(h);
}

/* open sequence */
const stage = $("stage");
let opened = false;
function openEnvelope() {
  if (opened) return; opened = true;
  stage.classList.add("is-open");
  setTimeout(() => { stage.classList.add("reading"); }, 1700);
}
$("seal").addEventListener("click", openEnvelope);
$("envelope").addEventListener("click", openEnvelope);

</script>
</body>
</html>
